[project]
name = "naxos-control-plane"
version = "0.1.0"
description = "naxos control plane: /v1 REST + SSE and the sandbox internal surface"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "naxos-shared",
    "google-auth>=2.35",
    "google-cloud-run>=0.10",
    "google-cloud-bigquery>=3.26",
    "google-cloud-scheduler>=2.13",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.16"]

[tool.uv.sources]
naxos-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naxos_cp"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
