[project]
name = "naxos-egress-proxy"
version = "0.1.0"
description = "naxos egress proxy: substitutes vault credentials into outbound requests"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "google-auth>=2.35",
    "google-cloud-secret-manager>=2.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naxos_egress"]

[tool.ruff]
line-length = 100
