[project]
name = "naxos-sandbox-runner"
version = "0.1.0"
description = "naxos per-session sandbox: Claude Agent SDK harness with permission gate and checkpointing"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.134",
    "httpx>=0.27",
    "anyio>=4.6",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "naxos-shared",
    "google-auth>=2.35",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16"]

[tool.uv.sources]
naxos-shared = { path = "../shared", editable = true }

[project.scripts]
naxos-sandbox = "naxos_sbx.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naxos_sbx"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
