name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read CLAUDE.md first for the project's constraints and conventions,
            then review the diff for:
            - Correctness bugs and edge cases
            - Violations of the hard constraints in CLAUDE.md (model exit via
              Vertex only, governance in the runtime wrapper, budget)
            - Security issues (IAM, secrets, injection, data leaving the boundary)
            - Missing or misleading tests
            - Needless complexity: prefer standard documented patterns

            Post concise inline comments on specific lines for real findings
            only, and finish with one short summary comment on the PR. If the
            change looks good, say so in the summary instead of inventing nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --max-turns 30
