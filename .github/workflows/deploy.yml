name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]

env:
  PROJECT: naxos-503510
  REGION: asia-northeast1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.16.0 check .
      - run: uvx ruff@0.16.0 format --check .

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1008450555904/locations/global/workloadIdentityPools/github/providers/github
          service_account: sa-deployer@${{ env.PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/cloud-run-source-deploy/naxos-runner"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          for role in $(jq -r 'keys[]' roles.json); do
            gcloud run jobs update "naxos-runner-$role" --region "$REGION" --image "$IMAGE:$GITHUB_SHA"
          done
