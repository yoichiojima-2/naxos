name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once by a repo admin (Settings → Pages → Source:
      # "GitHub Actions"): creating the site needs administration:write, which
      # GITHUB_TOKEN can never hold, so `enablement: true` always fails here.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages
      - id: deployment
        uses: actions/deploy-pages@v4
