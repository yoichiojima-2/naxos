name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy via the gh-pages branch: creating that branch auto-enables
      # Pages, unlike the "GitHub Actions" source, which requires a repo
      # admin to enable the site once in Settings → Pages (creating it needs
      # administration:write, which GITHUB_TOKEN can never hold).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/pages
          force_orphan: true
