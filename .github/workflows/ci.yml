name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.16.0 check control-plane/src sandbox-runner/src shared/src
      - run: uvx ruff@0.16.0 format --check control-plane/src sandbox-runner/src shared/src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: naxos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naxos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: control-plane
        run: uv sync --frozen --group dev
      - working-directory: control-plane
        run: uv run pytest -q
      - working-directory: sandbox-runner
        run: uv sync --frozen && uv run python -c "import naxos_sbx.main"
