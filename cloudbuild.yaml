steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REPO}/control-plane:${_TAG}
      - -f
      - control-plane/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REPO}/sandbox-runner:${_TAG}
      - -f
      - sandbox-runner/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REPO}/egress-proxy:${_TAG}
      - -f
      - egress-proxy/Dockerfile
      - .
images:
  - ${_REPO}/control-plane:${_TAG}
  - ${_REPO}/sandbox-runner:${_TAG}
  - ${_REPO}/egress-proxy:${_TAG}
substitutions:
  _REPO: asia-northeast1-docker.pkg.dev/naxos-503510/naxos
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
