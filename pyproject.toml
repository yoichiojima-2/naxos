[project]
name = "naxos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "fastapi>=0.140.9",
    "google-auth>=2.40.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-storage>=3.13.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naxos"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "ruff>=0.16.0",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# BLE001: agent tools deliberately catch Exception and return it as a tool result
ignore = ["BLE001"]
