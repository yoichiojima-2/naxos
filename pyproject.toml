[project]
name = "naxos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.128",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-storage>=3.13.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
# BLE001: agent tools deliberately catch Exception and return it as a tool result
ignore = ["BLE001"]
