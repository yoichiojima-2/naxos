[project]
name = "naxos-shared"
version = "0.1.0"
description = "Shared event and config models for naxos"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naxos_shared"]

[tool.ruff]
line-length = 100
